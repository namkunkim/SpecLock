name: SpecLock Check

# 문서(BR)와 테스트(@Spec)의 정합성을 검사한다.
# 이 검사가 있어야 문서 부패가 조용히 진행되지 않는다.
#   - 문서에 BR을 추가하고 테스트를 안 쓰면  → 빌드 실패
#   - 문서에서 BR을 지우면                  → 고아 테스트로 드러남
#
# docs/spec/ 은 저장소 루트가 아니라 각 모듈 아래에 생긴다.
#   domain/docs/spec/uc/...
#   data/docs/spec/uc/...
# 모듈이 몇 개든, 어디에 있든 자동으로 찾아 전부 검사한다.

on:
  pull_request:
    paths:
      - '**/docs/spec/**'
      - '**/test/**'
  push:
    branches: [main, develop]

jobs:
  spec-consistency:
    name: BR ↔ @Spec 정합성
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 정합성 검사 (모든 모듈)
        run: |
          chmod +x scripts/check-spec.sh
          set -e
          found=0
          # docs/spec/uc 를 가진 모든 모듈을 찾는다.
          # 예: domain/docs/spec/uc -> 모듈 루트는 domain
          while IFS= read -r spec_dir; do
            found=1
            module_dir="${spec_dir%/docs/spec/uc}"
            test_dir="$module_dir/src/test"
            echo "::group::$module_dir"
            ./scripts/check-spec.sh "$spec_dir" "$test_dir"
            echo "::endgroup::"
          done < <(find . -type d -path '*/docs/spec/uc')

          if [ "$found" -eq 0 ]; then
            echo "docs/spec/uc 를 가진 모듈이 없습니다. 스킵."
          fi

      # Windows 러너를 쓴다면, 단일 모듈 예시는 이렇게:
      #   - name: 정합성 검사 (domain 모듈)
      #     shell: pwsh
      #     run: .\scripts\check-spec.ps1 -SpecDir domain/docs/spec/uc -TestDir domain/src/test

  # 아래는 선택. BR 테스트만 따로 돌려 회귀를 빠르게 확인한다.
  spec-tests:
    name: BR 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: BR 테스트 실행
        run: ./gradlew test --tests '*SpecTest'

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-test-results
          path: '**/build/reports/tests/'
